<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Ceci n'est pas une page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, #090d16 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .code {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #38bdf8, #a855f7, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #cbd5e1; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: #38bdf8;
      color: #090d16;
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Ceci n'est pas une page</h1>
    <p>This route does not exist on the server. Head back to the main page and try again.</p>
    <a class="btn" href="/">Back to Home</a>
  </main>
</body>
</html>
